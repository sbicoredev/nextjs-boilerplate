services:
  app:
    container_name: ${APP_PREFIX}-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - app # `docker compose up` (no profile) stays dev-infra-only, as before;
      # run `docker compose --profile app up -d` to also build/run the app
      # container itself.

  postgres:
    container_name: ${APP_PREFIX}-db
    image: postgres:18.4-alpine
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    ports:
      - ${DB_PORT}:5432
    networks:
      - backend

  redis:
    container_name: ${APP_PREFIX}-redis
    image: redis:8.8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    ports:
      - 6379:6379
    networks:
      - backend

  # @upstash/ratelimit's client speaks Upstash's REST API over HTTPS,
  # not the raw Redis protocol — this shim puts a small REST server in
  # front of the `redis` service above so the exact same
  # core/rate-limit/upstash.ts code works unchanged against local Redis.
  # https://github.com/hiett/serverless-redis-http
  redis-http-proxy:
    container_name: ${APP_PREFIX}-redis-http-proxy
    image: hiett/serverless-redis-http:0.0.10
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token-not-for-production
      SRH_CONNECTION_STRING: redis://redis:${REDIS_PORT:-6379}
    restart: unless-stopped
    ports:
      - ${REDIS_PROXY_PORT:-8079}:80
    networks:
      - backend

  mailpit:
    container_name: ${APP_PREFIX}-mail
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - ${MAIL_UI_PORT:-8025}:8025 # Web UI
      - 1025:1025
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
