services:
  postgres:
    container_name: ${APP_PREFIX}-db
    image: postgres:18.4-alpine
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    ports:
      - ${DB_PORT}:5432
    networks:
      - backend

  redis:
    container_name: ${APP_PREFIX}-redis
    image: redis:8.8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    ports:
      - 6379:6379
    networks:
      - backend

  mailpit:
    container_name: ${APP_PREFIX}-mail
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
